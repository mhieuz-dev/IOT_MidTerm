; PlatformIO Project Configuration File - Bai giua ky (Wokwi simulation)
; Kien truc: Slave (ESP32) <-> Router (WiFi) <-> Cloud (server tu xay tren
; Render, xem webapp/) <-> Control & Display (trang Dashboard tu xay)

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_deps =
	adafruit/DHT sensor library
	adafruit/Adafruit Unified Sensor
	bblanchon/ArduinoJson@^6.21.5
